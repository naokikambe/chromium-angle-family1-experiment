name: Validate maintenance pull requests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic-validation:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Check out the proposed merge with main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate catalog and local synthetic suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-catalog.py
          python3 -m unittest discover -s tests -v

      - name: Validate publication guard fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_safe_push.py
          python3 scripts/test_safe_push_launcher.py

      - name: Scan the pull request head for publication privacy
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/check-publication-privacy.py --tree "$PR_HEAD"

  angle-build-validation:
    needs: synthetic-validation
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15-intel
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chrome-version: ['156.0.8078.48', '158.0.8127.37']
    steps:
      - name: Check out the proposed merge with main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact catalog inputs from the Chromium tag
        shell: bash
        env:
          CHROME_VERSION: ${{ matrix.chrome-version }}
        run: |
          set -euo pipefail
          {
            printf 'INPUTS_FILE=%s/pr-build-inputs.json\n' "$RUNNER_TEMP"
            printf 'ARTIFACT_DIR=%s/pr-angle-validation\n' "$RUNNER_TEMP"
            printf 'FAILURE_STAGE_FILE=%s/pr-build-stage\n' "$RUNNER_TEMP"
            printf 'ARTIFACT_NAME=angle-macos-x86_64-chrome-%s-run-%s\n' "$CHROME_VERSION" "$GITHUB_RUN_ID"
          } >> "$GITHUB_ENV"
          python3 scripts/prepare-pr-angle-inputs.py --chrome-version "$CHROME_VERSION" \
            --workflow-revision "$GITHUB_SHA" --source-dir "$RUNNER_TEMP/chromium-pr-source" \
            --output "$RUNNER_TEMP/pr-build-inputs.json"

      - name: Build and verify with the main build path
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-and-verify-angle.sh "$GITHUB_WORKSPACE" "$INPUTS_FILE" "$ARTIFACT_DIR" "$ARTIFACT_NAME"

      - name: Record PR-only validation provenance
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual == os.environ["GITHUB_SHA"]
          parents = subprocess.check_output(["git", "show", "-s", "--format=%P", "HEAD"], text=True).split()
          assert parents == [os.environ["PR_BASE"], os.environ["PR_HEAD"]]
          value = {"role": "pr-validation", "stable_indexed": False,
                   "pr_number": os.environ["PR_NUMBER"], "base_sha": parents[0], "head_sha": parents[1],
                   "merge_sha": actual,
                   "tree_sha": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()}
          (pathlib.Path(os.environ["ARTIFACT_DIR"]) / "PR_VALIDATION.json").write_text(json.dumps(value, indent=2) + "\n")
          PY

      - name: Keep PR validation binaries for seven days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
