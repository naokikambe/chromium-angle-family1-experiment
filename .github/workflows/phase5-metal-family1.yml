name: Phase 5 Metal Family 1 test stub

on:
  workflow_dispatch:
    inputs:
      angle_revision:
        description: Exact 40-character ANGLE revision for the pinned Phase 5 stub source
        required: true
        type: string
      run_stub:
        description: Run the existing test-only stub job
        required: false
        default: true
        type: boolean
      run_runtime:
        description: Run the Phase 5 runtime artifact reusable workflow
        required: false
        default: false
        type: boolean
      runtime_chrome_version:
        description: Chrome release version whose DEPS ANGLE pin must match for runtime
        required: false
        default: 154.0.8037.59
        type: string
      runtime_patch_sha256:
        description: SHA-256 of the checked-in Phase 5 runtime patch
        required: false
        default: 93573c6b846ee70d379af56cb571b3bd203b99688f5c90338a8d9dcc92b3e9d6
        type: string

concurrency:
  group: phase5-metal-family1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metal-family1-test-stub:
    if: inputs.run_stub
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      ANGLE_REPOSITORY: https://chromium.googlesource.com/angle/angle.git
      DEPOT_TOOLS_REPOSITORY: https://chromium.googlesource.com/chromium/tools/depot_tools.git
      DEPOT_TOOLS_REVISION: 0306e4682b4ac35287c726fa35a983157a625902
      DEPOT_TOOLS_UPDATE: "0"
      PATCH_PATH: patches/phase5-metal-family1-test-stub.patch
      ANGLE_REVISION: ${{ inputs.angle_revision }}
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "DIAG_DIR=$RUNNER_TEMP/phase5-metal-family1-test-stub" >> "$GITHUB_ENV"
          echo "ANGLE_ROOT=$RUNNER_TEMP/phase5-angle-source" >> "$GITHUB_ENV"
          echo "DEPOT_TOOLS_ROOT=$RUNNER_TEMP/phase5-depot-tools" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/phase5-metal-family1-test-stub"
          printf '%s\n' not-started > "$RUNNER_TEMP/phase5-metal-family1-test-stub/test-result.txt"

      - name: Static workflow and patch audit
        shell: bash
        run: bash tests/phase5-metal-family1-static.sh .github/workflows/phase5-metal-family1.yml "$PATCH_PATH"

      - name: Validate exact source input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ANGLE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$ANGLE_REVISION" = 1ff8799c596d4fc9acea28343610b1f33650a6fa
          printf 'ANGLE_REVISION=%s\n' "$ANGLE_REVISION" | tee "$DIAG_DIR/source-input.txt"

      - name: Fetch exact ANGLE source
        shell: bash
        run: |
          set -euo pipefail
          git init "$ANGLE_ROOT"
          git -C "$ANGLE_ROOT" remote add origin "$ANGLE_REPOSITORY"
          git -C "$ANGLE_ROOT" fetch --depth=1 origin "$ANGLE_REVISION"
          git -C "$ANGLE_ROOT" switch --detach FETCH_HEAD
          test "$(git -C "$ANGLE_ROOT" rev-parse HEAD)" = "$ANGLE_REVISION"

      - name: Bootstrap minimal standalone checkout
        shell: bash
        run: |
          set -euo pipefail
          git init "$DEPOT_TOOLS_ROOT"
          git -C "$DEPOT_TOOLS_ROOT" remote add origin "$DEPOT_TOOLS_REPOSITORY"
          git -C "$DEPOT_TOOLS_ROOT" fetch --depth=1 origin "$DEPOT_TOOLS_REVISION"
          git -C "$DEPOT_TOOLS_ROOT" switch --detach FETCH_HEAD
          test "$(git -C "$DEPOT_TOOLS_ROOT" rev-parse HEAD)" = "$DEPOT_TOOLS_REVISION"
          export PATH="$DEPOT_TOOLS_ROOT:$PATH"
          printf '%s\n' "$DEPOT_TOOLS_ROOT" >> "$GITHUB_PATH"
          "$DEPOT_TOOLS_ROOT/ensure_bootstrap"
          cd "$ANGLE_ROOT"
          python3 scripts/bootstrap.py
          gclient sync --no-history

      - name: Apply and verify Phase 5 stub patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(shasum -a 256 "$PATCH_PATH" | awk '{print $1}')" = 00a11d2289b306de4642cde3711cba051667b38fd5d97f46a434ba7f24ac5258
          git -C "$ANGLE_ROOT" apply --unidiff-zero --check "$GITHUB_WORKSPACE/$PATCH_PATH"
          git -C "$ANGLE_ROOT" apply --unidiff-zero "$GITHUB_WORKSPACE/$PATCH_PATH"
          expected=$(printf '%s\n' \
            BUILD.gn \
            gni/angle.gni \
            src/libANGLE/renderer/metal/BUILD.gn \
            src/libANGLE/renderer/metal/DisplayMtl.h \
            src/libANGLE/renderer/metal/DisplayMtl.mm \
            src/libANGLE/renderer/metal/DisplayMtlFamily1Test.mm \
            src/libANGLE/renderer/metal/DisplayMtlFamily1TestBridge.h \
            src/libANGLE/renderer/metal/DisplayMtlFamily1TestBridge.mm \
            src/tests/BUILD.gn \
            src/tests/DisplayMtlFamily1TestMain.cpp)
          actual=$(git -C "$ANGLE_ROOT" status --short | sed 's/^.. //' | LC_ALL=C sort)
          test "$actual" = "$(printf '%s\n' "$expected" | LC_ALL=C sort)"
          {
            printf 'SOURCE_REVISION=%s\n' "$(git -C "$ANGLE_ROOT" rev-parse HEAD)"
            printf 'PATCH_SHA256=%s\n' "$(shasum -a 256 "$PATCH_PATH" | awk '{print $1}')"
            git -C "$ANGLE_ROOT" status --short
          } > "$DIAG_DIR/source-state.txt"

      - name: GN configuration preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANGLE_ROOT"
          mkdir -p out/Phase5
          cat > out/Phase5/args.gn <<'EOF'
          is_debug = false
          is_component_build = false
          target_cpu = "x64"
          use_system_xcode = true
          clang_use_chrome_plugins = false
          angle_enable_metal = true
          angle_enable_metal_family1_test_stub = true
          angle_build_tests = true
          angle_enable_gl = false
          angle_enable_vulkan = false
          angle_enable_null = false
          angle_enable_wgpu = false
          angle_enable_cl = false
          build_angle_deqp_tests = false
          EOF
          shasum -a 256 out/Phase5/args.gn > "$DIAG_DIR/gn-args.sha256"
          gn gen out/Phase5 > "$DIAG_DIR/gn-stdout.log" 2> "$DIAG_DIR/gn-stderr.log"
          {
            printf '%s\n' '--- stub target sources ---'
            gn desc out/Phase5 //src/tests:angle_metal_family1_test_stub sources
            printf '%s\n' '--- metal backend sources ---'
            gn desc out/Phase5 //src/libANGLE/renderer/metal:angle_metal_backend sources
            printf '%s\n' '--- metal backend defines ---'
            gn desc out/Phase5 //src/libANGLE/renderer/metal:angle_metal_backend defines
            printf '%s\n' '--- libGLESv2 configs ---'
            gn desc out/Phase5 //:libGLESv2 configs
          } > "$DIAG_DIR/bridge-gn-desc.log"
          sed -n '/--- stub target sources ---/,/--- metal backend sources ---/p' "$DIAG_DIR/bridge-gn-desc.log" | grep -F 'DisplayMtlFamily1TestBridge.h'
          ! sed -n '/--- stub target sources ---/,/--- metal backend sources ---/p' "$DIAG_DIR/bridge-gn-desc.log" | grep -F 'DisplayMtlFamily1TestBridge.mm'
          sed -n '/--- metal backend sources ---/,/--- metal backend defines ---/p' "$DIAG_DIR/bridge-gn-desc.log" | grep -F 'DisplayMtlFamily1TestBridge.mm'
          sed -n '/--- metal backend defines ---/,/--- libGLESv2 configs ---/p' "$DIAG_DIR/bridge-gn-desc.log" | grep -F 'ANGLE_ENABLE_METAL_FAMILY1_TEST_STUB'
          sed -n '/--- libGLESv2 configs ---/,$p' "$DIAG_DIR/bridge-gn-desc.log" | grep -F 'metal_family1_test_libglesv2_export_config'
          sed -n '/--- libGLESv2 configs ---/,$p' "$DIAG_DIR/bridge-gn-desc.log" | grep -F '//:internal_config'

      - name: Build and test stub
        timeout-minutes: 45
        shell: bash
        run: |
          set -uo pipefail
          printf '%s\n' not-run > "$DIAG_DIR/test-result.txt"
          cd "$ANGLE_ROOT"
          bridge_object=obj/src/libANGLE/renderer/metal/angle_metal_backend/DisplayMtlFamily1TestBridge.o
          ninja -C out/Phase5 "$bridge_object" > "$DIAG_DIR/bridge-build.log" 2>&1
          nm -gU "out/Phase5/$bridge_object" > "$DIAG_DIR/bridge-nm.log"
          for symbol in \
            ANGLE_MetalFamily1TestEnableProfile \
            ANGLE_MetalFamily1TestClearProfile \
            ANGLE_MetalFamily1TestSetForcedStopStage \
            ANGLE_MetalFamily1TestGetStage \
            ANGLE_MetalFamily1TestGetSnapshot; do
            grep -E "[[:space:]][Tt][[:space:]]+_?${symbol}$" "$DIAG_DIR/bridge-nm.log"
          done
          printf 'BRIDGE_OBJECT=%s\n' "$bridge_object" > "$DIAG_DIR/bridge-symbol-status.txt"
          ninja -C out/Phase5 libEGL > "$DIAG_DIR/libegl-build.log" 2>&1
          ninja -C out/Phase5 libGLESv2 > "$DIAG_DIR/libglesv2-build.log" 2>&1
          gn desc out/Phase5 //:libGLESv2 outputs > "$DIAG_DIR/libglesv2-outputs.log"
          libglesv2_output=$(awk '$0 ~ /(^|\/)libGLESv2\.dylib$/ { print; exit }' "$DIAG_DIR/libglesv2-outputs.log")
          test -n "$libglesv2_output"
          libglesv2_path="$libglesv2_output"
          if [[ ! -f "$libglesv2_path" ]]; then
            libglesv2_path="$ANGLE_ROOT/${libglesv2_output#//}"
          fi
          if [[ ! -f "$libglesv2_path" ]]; then
            libglesv2_path="$ANGLE_ROOT/out/Phase5/libGLESv2.dylib"
          fi
          test -f "$libglesv2_path"
          nm -gU "$libglesv2_path" > "$DIAG_DIR/libglesv2-nm.log"
          for symbol in \
            ANGLE_MetalFamily1TestEnableProfile \
            ANGLE_MetalFamily1TestClearProfile \
            ANGLE_MetalFamily1TestSetForcedStopStage \
            ANGLE_MetalFamily1TestGetStage \
            ANGLE_MetalFamily1TestGetSnapshot; do
            grep -E "[[:space:]][Tt][[:space:]]+_?${symbol}$" "$DIAG_DIR/libglesv2-nm.log"
          done
          for symbol in EGL_GetPlatformDisplay EGL_Initialize EGL_GetError EGL_Terminate; do
            grep -E "[[:space:]][Tt][[:space:]]+_?${symbol}$" "$DIAG_DIR/libglesv2-nm.log"
          done
          printf 'LIBGLESV2_PATH=%s\n' "$libglesv2_path" > "$DIAG_DIR/libglesv2-symbol-status.txt"
          { xcrun clang --version; xcodebuild -version; gn --version; ninja --version; } > "$DIAG_DIR/build-metadata.txt" 2>&1
          ninja -C out/Phase5 angle_metal_family1_test_stub > "$DIAG_DIR/build-stdout.log" 2> "$DIAG_DIR/build-stderr.log"
          set +e
          (cd out/Phase5 && ./angle_metal_family1_test_stub --gtest_filter=DisplayMtlFamily1Test.*) > "$DIAG_DIR/test-stdout.log" 2> "$DIAG_DIR/test-stderr.log"
          test_rc=$?
          if [ "$test_rc" -ne 0 ]; then
            (cd out/Phase5 && lldb --batch \
              -o run -o bt -o quit -- \
              ./angle_metal_family1_test_stub --gtest_filter=DisplayMtlFamily1Test.*) \
              > "$DIAG_DIR/test-lldb-backtrace.log" 2>&1 || true
          fi
          set -e
          printf '%s\n' "$test_rc" > "$DIAG_DIR/test-result.txt"
          test "$test_rc" -eq 0

      - name: Write diagnostic manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAG_DIR"
          gn_args_sha256=not-generated
          if [[ -f "$DIAG_DIR/gn-args.sha256" ]]; then
            gn_args_sha256=$(awk '{print $1}' "$DIAG_DIR/gn-args.sha256")
          fi
          {
            printf 'SCHEMA=phase5-metal-family1-test-stub-v1\n'
            printf 'ARTIFACT_NAME=angle-metal-family1-test-stub-%s\n' "$GITHUB_RUN_ID"
            printf 'ANGLE_REVISION=%s\n' "$ANGLE_REVISION"
            printf 'PATCH_SHA256=%s\n' "$(shasum -a 256 "$PATCH_PATH" | awk '{print $1}')"
            printf 'GN_ARGS_SHA256=%s\n' "$gn_args_sha256"
            printf 'TEST_FILTER=DisplayMtlFamily1Test.*\n'
          } > "$DIAG_DIR/manifest.txt"
          shasum -a 256 "$DIAG_DIR/manifest.txt" > "$DIAG_DIR/manifest.sha256"
          (
            cd "$DIAG_DIR"
            find . -type f \
              ! -name artifact-files.sha256 \
              ! -name artifact.sha256 \
              -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256
          ) > "$DIAG_DIR/artifact-files.sha256"
          shasum -a 256 "$DIAG_DIR/artifact-files.sha256" > "$DIAG_DIR/artifact.sha256"

      - name: Upload stub diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: angle-metal-family1-test-stub-${{ github.run_id }}
          path: ${{ runner.temp }}/phase5-metal-family1-test-stub
          if-no-files-found: error
          retention-days: 14

  metal-family1-runtime:
    if: inputs.run_runtime
    uses: ./.github/workflows/phase5-metal-family1-runtime.yml
    with:
      angle_revision: ${{ inputs.angle_revision }}
      chrome_version: ${{ inputs.runtime_chrome_version }}
      runtime_patch_sha256: ${{ inputs.runtime_patch_sha256 }}
    permissions:
      contents: read
