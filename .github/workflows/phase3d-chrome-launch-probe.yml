name: Phase 3D Chrome for Testing launch probe

on:
  workflow_dispatch:
    inputs:
      chrome_version:
        description: Exact Chrome for Testing version (four numeric components)
        required: true
        type: string

permissions:
  contents: read

jobs:
  launch-probe:
    name: isolated-cft-launch-macos-intel
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      CHROME_VERSION: ${{ inputs.chrome_version }}

    steps:
      - name: Check out probe scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Audit workflow and probe script
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHROME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          bash -n scripts/run-phase3d-chrome-launch-probe.sh
          bash -n tests/phase3d-chrome-launch-probe-static.sh
          tests/phase3d-chrome-launch-probe-static.sh
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/phase3d-chrome-launch-probe.yml")'
          git diff --check

      - name: Run isolated Chrome for Testing launch probe
        shell: bash
        run: |
          set -euo pipefail
          probe_results="$RUNNER_TEMP/phase3d-cft-launch-probe-results"
          scripts/run-phase3d-chrome-launch-probe.sh "$CHROME_VERSION" "$probe_results"

      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3d-cft-launch-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/phase3d-cft-launch-probe-results
          if-no-files-found: error
          retention-days: 14
