name: Phase 3B synthetic fixtures

on:
  workflow_dispatch:
  push:
    branches: [phase3-dynamic-angle-prep]
    paths:
      - scripts/**
      - tests/**
      - docs/phase3-dynamic-angle.md
      - docs/phase3-signing-references.md
      - AGENTS.md
      - .codex/**
      - .github/workflows/phase3b-fixtures.yml

concurrency:
  group: phase3b-fixtures-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record runner and repository state
        shell: bash
        run: |
          set -euo pipefail
          diag="$RUNNER_TEMP/phase3b-fixtures-diagnostics"
          mkdir -p "$diag"
          {
            uname -a
            uname -m
            sw_vers
            bash --version | head -1
            xcode-select -p
            git --version
            printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-}" "${ImageVersion:-}"
            printf 'workflow_run_id=%s\ncommit_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA"
          } > "$diag/runner.txt"
          {
            git branch --show-current
            git rev-parse HEAD
            git status --short
            git log --oneline -5
          } > "$diag/repository.txt"

      - name: Static workflow self-audit
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/phase3b-fixtures.yml
          test "${GITHUB_REF_NAME:-}" = phase3-dynamic-angle-prep
          grep -F 'workflow_dispatch:' "$workflow"
          grep -F '  push:' "$workflow"
          ! grep -E 'pull_request(_target)?' "$workflow"
          grep -F 'runs-on: macos-15-intel' "$workflow"
          grep -F 'contents: read' "$workflow"
          grep -F 'timeout-minutes: 30' "$workflow"
          grep -F 'timeout-minutes: 20' "$workflow"
          github_ref_expr='$'
          github_ref_expr="${github_ref_expr}{{ github.ref }}"
          grep -F "phase3b-fixtures-$github_ref_expr" "$workflow"
          grep -F 'branches: [phase3-dynamic-angle-prep]' "$workflow"
          grep -F 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' "$workflow"
          grep -F 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' "$workflow"
          grep -F 'persist-credentials: false' "$workflow"
          ! grep -E 'pull_request_target|continue-on-error|secrets\.|id-token:|contents: write|git (push|reset|checkout|clean)|force-push|Google Chrome\.app|/Applications/|retry[0-3]' "$workflow"
          ! grep -E '(^|[[:space:]])(gh|curl)([[:space:]]|$)' "$workflow"
          ! grep -Ev 'upload-artifact|actions/upload-artifact' "$workflow" | grep -E '(^|[^A-Za-z])artifact|retry'
          grep -F 'if: always()' "$workflow"
          grep -F 'upload-artifact' "$workflow"
          grep -F "printf '%s\\n' not-completed" "$workflow"
          grep -F 'exit "$fixture_rc"' "$workflow"
          grep -F 'fixture-exit-status.txt' "$workflow"
          grep -F 'bash -x tests/phase3b-fixtures.sh' "$workflow"
          grep -F 'bash -x tests/phase3-release-artifact-fixtures.sh' "$workflow"

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: Parse workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' yaml_file; do
            ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))' "$yaml_file"
          done < <(find . -type f \( -name '*.yml' -o -name '*.yaml' \) \
            -not -path './.git/*' -print0 | LC_ALL=C sort -z)

      - name: Run full synthetic fixture suite
        timeout-minutes: 20
        shell: bash
        run: |
          set -uo pipefail
          diag="$RUNNER_TEMP/phase3b-fixtures-diagnostics"
          mkdir -p "$diag"
          printf '%s\n' not-completed > "$diag/fixture-exit-status.txt"
          set +e
          bash -x tests/phase3b-fixtures.sh > "$diag/fixture-stdout.log" 2> "$diag/fixture-stderr.log"
          phase3b_rc=$?
          printf '%s\n' "$phase3b_rc" > "$diag/phase3b-fixture-exit-status.txt"
          bash -x tests/phase3-release-artifact-fixtures.sh > "$diag/release-artifact-stdout.log" 2> "$diag/release-artifact-stderr.log"
          release_artifact_rc=$?
          printf '%s\n' "$release_artifact_rc" > "$diag/release-artifact-exit-status.txt"
          set -e
          fixture_rc=0
          [[ "$phase3b_rc" -eq 0 && "$release_artifact_rc" -eq 0 ]] || fixture_rc=1
          printf '%s\n' "$fixture_rc" > "$diag/fixture-exit-status.txt"
          exit "$fixture_rc"

      - name: Check repository diff formatting
        if: always()
        shell: bash
        run: git diff --check

      - name: Collect diagnostics index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          diag="$RUNNER_TEMP/phase3b-fixtures-diagnostics"
          {
            find "$diag" -maxdepth 1 -type f -print | sort
            git status --short
          } > "$diag/index.txt"

      - name: Upload synthetic fixture diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3b-synthetic-fixture-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/phase3b-fixtures-diagnostics
          if-no-files-found: error
          retention-days: 14
